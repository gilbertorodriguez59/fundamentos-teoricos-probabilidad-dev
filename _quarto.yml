project:
  type: book
  output-dir: docs
  resources:
    - figures/**

book:
  title: "Fundamentos Teóricos de Introducción a la Probabilidad"
  subtitle: "Conceptos, teoremas, demostraciones y modelos probabilísticos"
  author: "Jesús Gilberto Rodríguez Escobedo"
  date: "2026-08-14"
  cover-image: figures/portada-editorial.png
  output-file: "Fundamentos-Teoricos-de-Introduccion-a-la-Probabilidad"
  chapters:
    - index.qmd
    - bienvenida.qmd
    - presentacion.qmd
    - introduccion.qmd
    - notacion.qmd
    - 01-incertidumbre-modelos.qmd
    - 02-espacios-eventos.qmd
    - 03-conteo-probabilidad.qmd
    - 04-axiomas-probabilidad.qmd
    - 05-condicional-independencia.qmd
    - 06-probabilidad-total-bayes.qmd
    - 07-variable-aleatoria-cdf.qmd
    - 08-variables-discretas-pmf.qmd
    - 09-variables-continuas-densidad.qmd
    - 10-esperanza-varianza-chebyshev.qmd
    - 11-distribuciones-discretas-especiales.qmd
    - 12-hipergeometrica-poisson.qmd
    - 13-distribuciones-continuas-especiales.qmd
    - references.qmd
  page-footer:
    center: "Licencia CC BY-NC-SA 4.0"
  page-navigation: true
  sidebar:
    title: "Contenido del libro"
    style: docked
    collapse-level: 1
  downloads: [pdf]
  repo-url: https://github.com/gilbertorodriguez59/fundamentos-teoricos-probabilidad-dev

bibliography: references.bib
lang: es
number-depth: 2
toc-depth: 3

format:
  html:
    theme: cosmo
    toc: true
    toc-title: "En este capítulo"
    anchor-sections: true
    search: true
    html-math-method: mathjax
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    include-in-header: header.tex
    template-partials:
      - before-body.tex
    toc: true
    colorlinks: true
    keep-tex: false
    fig-pos: H
    lof: true
    lot: true

execute:
  freeze: auto
  warning: false
  message: false
