<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06182e"/><stop offset="1" stop-color="#073657"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#255b7f" stroke-width="1" opacity=".22"/></pattern></defs>
<rect width="1055" height="1491" fill="url(#bg)"/><rect y="700" width="1055" height="690" fill="url(#grid)"/>
<path d="M0 24H1055M0 102H1055" stroke="#2ec6c4" stroke-width="1.5" opacity=".8"/>
<text x="72" y="60" fill="#dceef7" font-family="Arial" font-size="20" letter-spacing="5">MATEMÁTICAS APLICADAS</text><text x="72" y="84" fill="#dceef7" font-family="Arial" font-size="20" letter-spacing="4">PARA LA INGENIERÍA Y LAS CIENCIAS</text>
<text x="760" y="56" fill="#44c3b6" font-family="Arial" font-size="19" letter-spacing="2">COLECCIÓN</text><text x="694" y="82" fill="#eef8fc" font-family="Arial" font-size="20" letter-spacing="2">CIENCIA Y TECNOLOGÍA</text>
<text x="80" y="205" fill="white" font-family="Arial" font-size="70" font-weight="700">Fundamentos Teóricos de</text>
<text x="78" y="320" fill="white" font-family="Arial" font-size="116" font-weight="700">Introducción a la</text>
<text x="78" y="450" fill="white" font-family="Arial" font-size="132" font-weight="700">Probabilidad</text>
<line x1="86" y1="500" x2="918" y2="500" stroke="#42c2c0" stroke-width="2"/><circle cx="918" cy="500" r="5" fill="#42c2c0"/>
<text x="86" y="555" fill="#63b6e6" font-family="Arial" font-size="38" font-style="italic">Conceptos, teoremas, demostraciones</text><text x="86" y="602" fill="#63b6e6" font-family="Arial" font-size="38" font-style="italic">y modelos probabilísticos</text>
<line x1="0" y1="660" x2="254" y2="660" stroke="#42c2c0" stroke-width="2"/><line x1="790" y1="660" x2="1055" y2="660" stroke="#42c2c0" stroke-width="2"/><text x="275" y="674" fill="white" font-family="Arial" font-size="30">Jesús Gilberto Rodríguez Escobedo</text>
<!-- probability space box -->
<rect x="38" y="720" width="235" height="205" rx="12" fill="none" stroke="#29b9c6" stroke-width="2"/>
<g fill="#bfe9f7" font-family="serif" font-size="24"><text x="55" y="755">(Ω, 𝓕, P)</text><text x="55" y="790">Ω ≠ ∅</text><text x="55" y="825">𝓕 ⊆ 2^Ω</text><text x="55" y="862">• Ω ∈ 𝓕</text><text x="55" y="897">• A ∈ 𝓕 ⇒ Aᶜ ∈ 𝓕</text></g>
<!-- venn -->
<g transform="translate(300,730)"><circle cx="80" cy="85" r="68" fill="none" stroke="#42c8d6" stroke-width="2"/><circle cx="150" cy="85" r="68" fill="none" stroke="#42c8d6" stroke-width="2"/><text x="58" y="88" fill="#dff7ff" font-size="24">A</text><text x="166" y="88" fill="#dff7ff" font-size="24">B</text><text x="100" y="178" fill="#dff7ff" font-size="22">A ∩ B</text></g>
<g fill="#bfe9f7" font-family="serif" font-size="23"><text x="545" y="755">Aᶜ = Ω \ A</text><text x="545" y="790">A ∪ B</text><text x="545" y="825">A ∩ B</text><text x="545" y="860">A \ B = A ∩ Bᶜ</text><text x="545" y="895">A Δ B = (A\B) ∪ (B\A)</text></g>
<!-- probability tree -->
<g stroke="#50c7d8" stroke-width="2" fill="none"><line x1="760" y1="800" x2="850" y2="755"/><line x1="760" y1="800" x2="850" y2="850"/><line x1="850" y1="755" x2="945" y2="720"/><line x1="850" y1="755" x2="945" y2="785"/><line x1="850" y1="850" x2="945" y2="820"/><line x1="850" y1="850" x2="945" y2="885"/></g>
<g fill="#62d1c4" font-size="23" font-family="serif"><text x="855" y="748">A</text><text x="855" y="864">Aᶜ</text><text x="956" y="725">B</text><text x="956" y="792">Bᶜ</text><text x="956" y="825">B</text><text x="956" y="892">Bᶜ</text></g>
<!-- theorem boxes -->
<g fill="none" stroke="#2fabc2" stroke-width="1.5"><rect x="38" y="945" width="315" height="96" rx="10"/><rect x="371" y="945" width="280" height="96" rx="10"/><rect x="670" y="945" width="345" height="96" rx="10"/></g>
<g fill="#cdeefa" font-family="serif"><text x="58" y="978" font-size="21">Teorema de la Probabilidad Total</text><text x="58" y="1016" font-size="19">P(B)=P(A)P(B|A)+P(Aᶜ)P(B|Aᶜ)</text><text x="420" y="978" font-size="22">Teorema de Bayes</text><text x="405" y="1016" font-size="20">P(A|B)=P(B|A)P(A)/P(B)</text><text x="760" y="978" font-size="22">Independencia</text><text x="706" y="1016" font-size="19">A ⟂ B ⇔ P(A∩B)=P(A)P(B)</text></g>
<!-- combinatorics -->
<g fill="#d7f0f8" font-family="serif"><text x="45" y="1100" font-size="30">n! = 1·2·…·n</text><text x="45" y="1150" font-size="30">C(n,k)= n!/[k!(n−k)!]</text><text x="45" y="1200" font-size="28">P(A)=|A|/|Ω|  (caso finito)</text></g>
<!-- normal curve -->
<g transform="translate(330,1075)"><line x1="0" y1="180" x2="340" y2="180" stroke="white"/><path d="M10 180 C70 180,85 35,170 25 C255 35,270 180,330 180" fill="none" stroke="#79d5f5" stroke-width="4"/><line x1="170" y1="25" x2="170" y2="180" stroke="#bceeff" stroke-dasharray="7 7"/><text x="163" y="205" fill="#dff7ff" font-size="20">μ</text><text x="210" y="92" fill="#dff7ff" font-size="20">σ</text><text x="190" y="30" fill="#dff7ff" font-size="17">f(x)</text></g>
<!-- expectation box -->
<rect x="715" y="1070" width="270" height="190" rx="12" fill="none" stroke="#2fabc2" stroke-width="1.5"/><g fill="#d7f0f8" font-family="serif" font-size="24"><text x="735" y="1110">E(X)=Σ xP(X=x)</text><text x="735" y="1152">E(aX+b)=aE(X)+b</text><text x="735" y="1194">Var(X)=E[(X−E(X))²]</text><text x="735" y="1236">=E(X²)−[E(X)]²</text></g>
<!-- sigma algebra -->
<rect x="38" y="1280" width="650" height="120" rx="12" fill="none" stroke="#2fabc2" stroke-width="1.5"/><g fill="#cdeefa" font-family="serif"><text x="58" y="1316" font-size="22">𝓕 es una σ-álgebra sobre Ω si:</text><text x="350" y="1316" font-size="20">(i) Ω ∈ 𝓕</text><text x="350" y="1350" font-size="20">(ii) A ∈ 𝓕 ⇒ Aᶜ ∈ 𝓕</text><text x="350" y="1384" font-size="20">(iii) {Aₙ}⊆𝓕 ⇒ ⋃Aₙ∈𝓕</text></g>
