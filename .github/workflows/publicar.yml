name: Publicar libro en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Instalar dependencias de R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
          install-quarto: false

      - name: Verificar dependencias de R
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("knitr", quietly = TRUE))
          stopifnot(requireNamespace("rmarkdown", quietly = TRUE))
          cat("knitr:", as.character(packageVersion("knitr")), "\n")
          cat("rmarkdown:", as.character(packageVersion("rmarkdown")), "\n")

      - name: Renderizar HTML
        run: quarto render --to html

      - name: Publicar en gh-pages
        run: quarto publish gh-pages --no-render --no-browser --no-prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
