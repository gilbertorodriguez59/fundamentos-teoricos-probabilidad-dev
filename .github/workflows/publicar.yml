name: Generar libro Quarto en docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Instalar Quarto y TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Instalar dependencias de R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
          install-quarto: false

      - name: Verificar dependencias de R
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("knitr", quietly = TRUE))
          stopifnot(requireNamespace("rmarkdown", quietly = TRUE))
          cat("knitr:", as.character(packageVersion("knitr")), "\n")
          cat("rmarkdown:", as.character(packageVersion("rmarkdown")), "\n")

      - name: Renderizar HTML y PDF en docs
        run: |
          quarto render
          touch docs/.nojekyll

      - name: Guardar libro generado en main/docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs
          if git diff --cached --quiet; then
            echo "No hay cambios en docs."
          else
            git commit -m "Actualizar sitio web y PDF [skip ci]"
            git push
          fi
