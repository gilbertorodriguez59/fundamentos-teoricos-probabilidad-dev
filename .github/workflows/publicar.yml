name: Publicar libro en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Instalar paquetes de R necesarios para Quarto
        shell: Rscript {0}
        run: |
          install.packages(c("knitr", "rmarkdown"), repos = "https://cloud.r-project.org")

      - name: Renderizar HTML
        run: quarto render --to html

      - name: Publicar en gh-pages
        run: quarto publish gh-pages --no-render --no-browser --no-prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
