name: Generar libro Quarto en docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: quarto-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Insertar materiales complementarios en los capítulos
        run: python scripts/insertar_materiales.py

      - name: Instalar Quarto y TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Instalar dependencias de R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
          install-quarto: false

      - name: Verificar dependencias de R
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("knitr", quietly = TRUE))
          stopifnot(requireNamespace("rmarkdown", quietly = TRUE))

      - name: Preparar portada editorial
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1055 -h 1491 figures/portada-editorial.svg -o figures/portada-editorial.png

      - name: Renderizar HTML y PDF en docs
        run: |
          quarto render
          touch docs/.nojekyll

      - name: Guardar fuentes y libro generado en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs figures/portada-editorial.png 0*.qmd
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Insertar materiales y actualizar sitio [skip ci]"
            git pull --rebase origin main
            git push
          fi
